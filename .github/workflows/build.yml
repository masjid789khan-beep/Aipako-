name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: |
          npm install

      - name: Build Web Production Assets
        run: |
          npm run build

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            if [ -f "./gradlew" ]; then
              ./gradlew assembleDebug --stacktrace
            else
              gradle assembleDebug --stacktrace
            fi
          elif [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate Generated APK
        id: apk-finder
        run: |
          echo "Scanning for built APKs..."
          find . -name "*.apk" -type f
          APK_PATH=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "Found APK at $APK_PATH"
          else
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload Built Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aipako-ai-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
