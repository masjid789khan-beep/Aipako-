<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="#0066FF" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Energy Outer Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06B6D4" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#0066FF" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Glowing AI Orb -->
  <circle cx="256" cy="256" r="120" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="220" cy="220" r="40" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="256" cy="256" r="16" fill="#FFFFFF" fill-opacity="0.9"/>
  
  <!-- Modern Tech Notch Accent -->
  <path d="M 200 360 L 312 360" stroke="#06B6D4" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>
